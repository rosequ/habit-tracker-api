name: Deploy

# main is protected and requires the fast-gates check (see branch
# protection on main), so anything landing here via a normal merge has
# already passed Phase A's blocking checks. No need to re-gate on a fresh
# CI run -- a push to main can only happen through a check-passing merge (or
# an admin bypass, which is out of scope here).
on:
  push:
    branches: [main]
  # garbage-collector.yml's auto-merge pushes to main using GITHUB_TOKEN,
  # which (by GitHub's anti-recursion rule) does NOT cascade into this
  # workflow's `push` trigger -- so it explicitly re-dispatches this via
  # `gh workflow run deploy.yml --ref main` right after a successful merge.
  # Without this, a garbage-collector auto-merge would silently leave Render
  # serving a stale build until some human-authored push happened to land.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
