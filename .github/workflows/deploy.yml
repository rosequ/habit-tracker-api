name: Deploy

# No re-gating here: by the time a normal PR merge lands on main, fast-gates
# has already run against it. This is NOT server-side enforced -- branch
# protection 403s on this private, Free-plan repo (issue #7), so a merge
# could in principle happen without fast-gates passing (or a direct push,
# though .githooks/pre-push blocks that client-side). Re-running fast-gates
# here wouldn't change that; it's tracked as a known gap, not solved by
# this workflow.
on:
  push:
    branches: [main]
  # garbage-collector.yml's auto-merge pushes to main using GITHUB_TOKEN,
  # which (by GitHub's anti-recursion rule) does NOT cascade into this
  # workflow's `push` trigger -- so it explicitly re-dispatches this via
  # `gh workflow run deploy.yml --ref main` right after a successful merge.
  # Without this, a garbage-collector auto-merge would silently leave Render
  # serving a stale build until some human-authored push happened to land.
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
