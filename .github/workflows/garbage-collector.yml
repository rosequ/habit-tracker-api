name: Garbage Collector

# Runs weekly. Headless Claude Code scans the codebase for deviations from
# AGENTS.md's architecture rules that import-linter's layers contract can't
# catch stylistically (it only enforces the directed layer graph, not things
# like a route doing business logic inline, dead code, or small duplicated
# logic), dead code, and small opportunistic tidy-ups, then opens a small,
# targeted refactor PR. Auto-merges only if the inline fast-gates-equivalent
# checks pass AND the diff is under 50 changed lines total AND it doesn't
# touch a small deny-list of categorically-higher-blast-radius paths
# (workflow files, migrations, lockfile/config) regardless of size. Anything
# else falls back to needs-human-review (see scripts/gate_and_merge.sh) --
# no exceptions, per AGENTS.md.
#
# Same "why not gh pr merge --auto" rationale as doc-gardener.yml: branch
# protection 403s here (issue #7), so the merge decision is made from an
# inline check run in this same job, not a polled/awaited external one.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

env:
  DATABASE_URL: postgresql+asyncpg://habit:habit_dev_password@localhost:5432/habit_tracker
  APP_PORT: 8000
  # Provider dispatch for scripts/run_agent.sh -- see #15. Defaults to
  # 'claude' (today's behavior) whenever the repo variable isn't set. This
  # workflow can auto-merge -- don't flip the repo variable to 'north' here
  # without a real side-by-side quality comparison first (see
  # docs/architecture/agent-providers.md).
  AGENT_PROVIDER: ${{ vars.AGENT_PROVIDER || 'claude' }}

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  # No cancel-in-progress (defaults to false): this does a non-atomic
  # git/gh sequence (branch, commit, push, PR, maybe merge) -- queuing a
  # second run behind an in-flight one is safe; cancelling one mid-sequence
  # is not.
  group: ${{ github.workflow }}

jobs:
  collect:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: habit
          POSTGRES_PASSWORD: habit_dev_password
          POSTGRES_DB: habit_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - run: uv run alembic upgrade head

      - name: Create a working branch
        run: |
          branch="garbage-collector/${GITHUB_RUN_NUMBER}"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          git checkout -b "$branch"
          git config user.name "habit-tracker-agent"
          git config user.email "agent@users.noreply.github.com"

      - name: Ask the agent to find and fix one small tidy-up
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          agents_md="$(cat AGENTS.md)"
          api_conventions="$(cat docs/architecture/api-conventions.md)"

          # Unique delimiter -- see doc-gardener.yml for why a bare EOF isn't
          # safe here (interpolated file contents, not just static prose).
          prompt="$(cat <<GARBAGECOLLECTOR_PROMPT_EOF_6b2d
          You are a small-scope refactoring agent running unattended, on a
          weekly schedule, in a fresh branch off main. Nobody is watching
          this run in real time -- be conservative.

          Your job: scan app/ for ONE small deviation from this repo's
          architecture rules that import-linter's automated layers contract
          would NOT catch on its own, because it only enforces the directed
          import graph (routes -> schemas -> services -> repository -> db),
          not the spirit of that layering. Look for things like: a route
          doing more than calling a service and shaping the response: no
          business logic in app/routes/; dead code (unused functions,
          imports, or files); small duplicated logic that could be a shared
          helper without changing behavior; a file creeping toward the
          400-line split limit.

          Fix exactly ONE such issue with the smallest correct change. This
          is a hard constraint, not a suggestion: the resulting diff MUST be
          under 50 changed lines total (insertions + deletions), or this PR
          will NOT auto-merge regardless of correctness -- it'll sit in
          needs-human-review instead. If the smallest correct fix for
          anything you find would exceed that, pick a smaller issue instead,
          or make no changes and describe the larger issue in your final
          message for a human to pick up separately.

          Do not touch .github/workflows/, alembic/versions/, uv.lock, or
          pyproject.toml -- those are excluded from auto-merge eligibility
          regardless of size, so changes there always need a human anyway.

          If nothing worth fixing this small exists, make no changes and say
          so plainly in your final message.

          Do NOT run git commit, git push, or gh pr create yourself -- the
          workflow does that after you finish, using whatever working-tree
          changes you leave behind.

          === AGENTS.md ===
          $agents_md

          === docs/architecture/api-conventions.md ===
          $api_conventions
          GARBAGECOLLECTOR_PROMPT_EOF_6b2d
          )"

          bash scripts/run_agent.sh <<< "$prompt"

      - name: Check for changes
        id: changes
        run: |
          # Bare `git diff --name-only` only reports UNSTAGED modifications
          # to tracked files -- it misses both staged changes (nothing in
          # the prompt forbids Claude from running `git add`, only `git
          # commit`/`push`/`pr create`) and brand-new, un-`git add`ed files.
          # Union in `--cached` and untracked files too, or a fix that
          # stages a file (or ADDS a new small shared helper) would report
          # changed=false and get silently discarded, with no PR and no
          # explanation.
          changed="$(git diff --name-only; git diff --cached --name-only; git ls-files --others --exclude-standard)"
          if [[ -z "$changed" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit Claude's changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          # Commit BEFORE verification/gitleaks below, not after -- both
          # need a real commit to scope themselves against (git merge-base/
          # log-opts operate on commits, not the working tree). Committing
          # this early is exactly what makes those checks meaningful: they
          # verify what's actually about to become the PR, not a stale,
          # already-merged range.
          git add -A
          git commit -m "[garbage-collector] small architecture tidy-up (run $GITHUB_RUN_ID)"

      - name: Inline fast-gates-equivalent verification
        if: steps.changes.outputs.changed == 'true'
        id: verify
        continue-on-error: true
        run: |
          make lint
          # Nothing in the prompt above forbids touching docs/ -- it's just
          # scoped to app/ by what it's asked to look for. Run the same
          # (currently non-emptiness-only) doc check doc-gardener.yml runs,
          # for consistency, rather than silently having no check here at
          # all if that scope is ever loosened.
          make lint-docs
          make test

      - name: gitleaks (scoped to this branch's own commit, not full history)
        if: steps.changes.outputs.changed == 'true'
        id: gitleaks
        continue-on-error: true
        run: |
          # See doc-gardener.yml for why this doesn't use
          # gitleaks/gitleaks-action@v2 directly: it only scopes its scan to
          # a commit range for push/pull_request events (confirmed by
          # reading its source); for workflow_dispatch/schedule (this
          # workflow's own triggers) it scans this repo's ENTIRE git history
          # instead, which would fail forever on any pre-existing
          # secret-shaped string in history, unrelated to this run's diff.
          # This only works because "Commit Claude's changes" above already
          # ran -- HEAD is the new commit, not main, by the time this
          # executes.
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          merge_base="$(git merge-base HEAD main)"
          # `${merge_base}^..HEAD` (with the caret) is NOT "just the commits
          # this branch adds" -- `A^..B` excludes ancestors of A^, and
          # merge_base isn't its own ancestor via its parent, so merge_base
          # ITSELF is included too, over-scanning an already-merged main
          # commit every run (verified directly -- see doc-gardener.yml).
          # `A..B` (no caret) is the correct, standard "commits on B not on
          # A" range.
          ./gitleaks detect --redact -v --log-opts="--no-merges --first-parent ${merge_base}..HEAD"

      - name: Push branch and open PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin "$BRANCH"

          gh label create garbage-collector --color 5319E7 --description "Opened by garbage-collector.yml" --force

          # See doc-gardener.yml for why this captures the PR number from
          # `gh pr create`'s own URL output instead of a separate `gh pr
          # list` lookup.
          pr_url="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Small architecture tidy-up (run $GITHUB_RUN_ID)" \
            --label garbage-collector \
            --body "Automated architecture tidy-up by \`garbage-collector.yml\` (run $GITHUB_RUN_ID). Auto-merges only if lint/test/gitleaks pass AND the diff is under 50 changed lines AND it doesn't touch \`.github/workflows/\`, \`alembic/versions/\`, \`uv.lock\`, or \`pyproject.toml\` -- otherwise falls back to \`needs-human-review\`, no exceptions.")"
          echo "PR_NUMBER=${pr_url##*/}" >> "$GITHUB_ENV"

      - name: Decide merge vs. needs-human-review
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number="$PR_NUMBER"

          verify_passed=true
          failed=()
          if [[ "${{ steps.verify.outcome }}" != "success" ]]; then
            failed+=("make lint/make lint-docs/make test")
          fi
          if [[ "${{ steps.gitleaks.outcome }}" != "success" ]]; then
            failed+=("gitleaks")
          fi
          if [[ ${#failed[@]} -gt 0 ]]; then
            verify_passed=false
          fi
          # `"${failed[*]}"` with IFS=', ' only actually joins on the FIRST
          # character of IFS (a comma, no space) -- printf+strip instead to
          # get the intended ", "-separated list.
          joined="$(printf ', %s' "${failed[@]}")"
          verify_detail="the inline verification failed: ${joined#, }"

          bash scripts/gate_and_merge.sh \
            --pr "$pr_number" \
            --verify-passed "$verify_passed" \
            --verify-detail "$verify_detail" \
            --marker "[garbage-collector]" \
            --max-diff-lines 50 \
            --deny-glob ".github/workflows/*" \
            --deny-glob "alembic/versions/*" \
            --deny-glob "uv.lock" \
            --deny-glob "pyproject.toml" \
            --deny-glob "docs/quality.md" \
            --redeploy
