name: Quality Grader

# Runs monthly. Headless Claude Code assesses the codebase and writes/updates
# docs/quality.md: a per-layer (routes/schemas/services/repository/db) table
# covering import-linter/layering compliance, doc freshness (last
# [doc-gardener]-tagged touch), and count of currently-open cleanup PRs
# touching that layer. Deliberately excludes a test-coverage-delta metric
# (a weak/lagging signal) -- the layering-compliance column already folds in
# a structural-lint-violations count as the behavior-grounded signal in its
# place.
#
# Unlike doc-gardener.yml/garbage-collector.yml, this workflow NEVER
# auto-merges: a report generator shouldn't be silently rewriting its own
# audit trail. Always opens a PR labeled needs-human-review, regardless of
# outcome.
on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:

env:
  # Provider dispatch for scripts/run_agent.sh -- see #15. Defaults to
  # 'claude' (today's behavior) whenever the repo variable isn't set.
  AGENT_PROVIDER: ${{ vars.AGENT_PROVIDER || 'claude' }}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Only need lint-imports installed -- no DB/migrations required, this
      # workflow never touches app code or runs the test suite.
      - run: uv sync --frozen

      - name: Create a working branch
        run: |
          branch="quality-report/${GITHUB_RUN_NUMBER}"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"
          git checkout -b "$branch"
          git config user.name "habit-tracker-agent"
          git config user.email "agent@users.noreply.github.com"

      - name: Gather ground-truth data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/quality_report_data.sh > /tmp/quality-data.txt

      - name: Ask the agent to write docs/quality.md
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          agents_md="$(cat AGENTS.md)"
          quality_data="$(cat /tmp/quality-data.txt)"
          existing_report="$(cat docs/quality.md 2>/dev/null || echo '(docs/quality.md does not exist yet -- this is the first run)')"

          # Unique delimiter -- see doc-gardener.yml for why a bare EOF isn't
          # safe here (interpolated file/report contents, not just static
          # prose).
          prompt="$(cat <<QUALITYGRADER_PROMPT_EOF_3d7c
          You are a monthly code-quality report generator running
          unattended, in a fresh branch off main. Nobody is watching this run
          in real time.

          Write or update docs/quality.md: ONE markdown table, one row per
          layer (routes, schemas, services, repository, db), with these
          columns:
          - Import-linter / layering compliance (use the lint-imports output
            and per-layer file counts below; today the single "Layered
            architecture" contract is either fully kept or broken -- if kept,
            every row is 100% with a note that 0 violations were found; if
            broken, name the specific violating files/imports and compute
            each affected layer's percentage from the violation count over
            its file count)
          - Doc freshness (the date + which doc file, from the data below --
            routes/schemas share docs/domains/*/README.md's date;
            services/repository/db share docs/architecture/api-conventions.md's
            date; that's expected given today's doc structure, not an error)
          - Open cleanup PRs touching that layer (from the data below)

          Do NOT add a test-coverage-delta column or metric -- deliberately
          excluded on purpose as a weak/lagging signal. Above or below the
          table, add 1-2 short sentences of narrative interpretation if
          something stands out (e.g. a layer with no doc touch in a long
          time, or several open cleanup PRs stacking up on one layer) --
          otherwise keep it terse, this is a report, not an essay.

          Only ever edit docs/quality.md. Do not touch any other file.

          Do NOT run git commit, git push, or gh pr create yourself -- the
          workflow does that after you finish.

          === AGENTS.md ===
          $agents_md

          === Ground-truth data for this run ===
          $quality_data

          === Existing docs/quality.md (update in place; this is the previous month's report) ===
          $existing_report
          QUALITYGRADER_PROMPT_EOF_3d7c
          )"

          bash scripts/run_agent.sh <<< "$prompt"

      - name: Enforce scope -- only docs/quality.md may change
        id: scope
        run: |
          # Bare `git diff --name-only` only reports UNSTAGED modifications
          # to tracked files -- union in `--cached` and untracked files too,
          # or a file Claude staged with `git add` would be invisible here.
          all_changed="$(git diff --name-only; git diff --cached --name-only; git ls-files --others --exclude-standard)"
          if [[ -z "$all_changed" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          out_of_scope="$(grep -vFx 'docs/quality.md' <<< "$all_changed" || true)"

          if [[ -n "$out_of_scope" ]]; then
            echo "Claude's diff touched files outside docs/quality.md -- discarding them before commit (this workflow must never ship an app/code diff, even under needs-human-review):" >&2
            echo "$out_of_scope" >&2
            while IFS= read -r f; do
              [[ -z "$f" ]] && continue
              # Unconditionally unstage first: `git ls-files --error-unmatch`
              # alone mis-handles a staged deletion (`git rm`) -- the path
              # is already gone from the index, so it looks like an
              # untracked/new path and falls into the `rm -f` branch below,
              # a no-op that leaves the deletion staged and committed later.
              # Deciding restore-vs-remove by whether the path exists IN
              # HEAD (not by whether it's in the index right now) handles
              # staged modifications, staged deletions, and staged/unstaged
              # new files uniformly, and can't fail on a path HEAD never had
              # (an earlier version used `git checkout HEAD -- "$f"`
              # unconditionally for any indexed path, which errors out --
              # aborting this step under GitHub Actions' default
              # `bash -eo pipefail` -- for a staged new file, since it has
              # no HEAD blob to restore from).
              git reset -q HEAD -- "$f" 2>/dev/null || true
              if git cat-file -e "HEAD:$f" 2>/dev/null; then
                git checkout HEAD -- "$f"
              else
                rm -f "$f"
              fi
            done <<< "$out_of_scope"
            {
              echo "out_of_scope<<QUALITY_SCOPE_EOF_8b1a"
              echo "$out_of_scope"
              echo "QUALITY_SCOPE_EOF_8b1a"
            } >> "$GITHUB_OUTPUT"
          fi

          if grep -qFx 'docs/quality.md' <<< "$all_changed"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch and open PR
        if: steps.scope.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed via env, not interpolated as `${{ }}` directly into the
          # script body: `out_of_scope` is built from file paths an
          # unattended, bypassPermissions Claude session chose (via `git
          # diff`/`git ls-files`) -- a path containing a quote, backtick, or
          # `$(...)` would otherwise break out of the script text at the
          # point GitHub substitutes `${{ }}` (before bash ever runs it),
          # executing arbitrary shell with this job's write-scoped token.
          # `env:` values are passed as data, never re-parsed as script.
          OUT_OF_SCOPE: ${{ steps.scope.outputs.out_of_scope }}
        run: |
          gh label create needs-human-review --color B60205 --description "Unattended agent output -- requires human review before merge" --force
          gh label create quality-report --color 5A5A5A --description "Opened by quality-grader.yml" --force

          git add docs/quality.md
          git commit -m "[quality-report] monthly code-quality report (run $GITHUB_RUN_ID)"
          git push origin "$BRANCH"

          scope_note=""
          if [[ -n "$OUT_OF_SCOPE" ]]; then
            scope_note="

          **Note:** Claude's raw output also touched files outside \`docs/quality.md\` this run -- they were discarded before this commit and never left the runner:
          \`\`\`
          $OUT_OF_SCOPE
          \`\`\`
          Worth investigating the prompt/tooling even though nothing out-of-scope was shipped."
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "quality-report: monthly code-quality report (run $GITHUB_RUN_ID)" \
            --label needs-human-review \
            --label quality-report \
            --body "Automated monthly code-quality assessment by \`quality-grader.yml\` (run $GITHUB_RUN_ID). This PR has NOT been merged and must not be merged without human review, regardless of check status -- a report generator shouldn't silently rewrite its own audit trail.$scope_note"

      # Covers the one case the PR above can't: Claude touched files outside
      # docs/quality.md but never actually touched docs/quality.md itself, so
      # there's no report content to commit and open a PR for. Still leave a
      # visible trail -- an unattended agent touching unexpected files is
      # worth a human's attention even when nothing merges.
      - name: File an issue if out-of-scope touch produced no report change
        if: steps.scope.outputs.changed == 'false' && steps.scope.outputs.out_of_scope != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # See "Push branch and open PR" above for why this is passed via
          # env and referenced as $OUT_OF_SCOPE, not interpolated directly
          # into the script as `${{ }}`.
          OUT_OF_SCOPE: ${{ steps.scope.outputs.out_of_scope }}
        run: |
          # Self-contained: don't assume needs-human-review already exists
          # repo-wide just because the other two workflows happen to create
          # it too (true today, but this step shouldn't depend on that).
          gh label create needs-human-review --color B60205 --description "Unattended agent output -- requires human review before merge" --force
          gh issue create \
            --title "quality-grader.yml touched out-of-scope files, produced no report (run $GITHUB_RUN_ID)" \
            --label needs-human-review \
            --body "Automated run of \`quality-grader.yml\` (run $GITHUB_RUN_ID) touched files outside \`docs/quality.md\` and did not update the report itself. The out-of-scope changes were discarded before anything was committed -- nothing merged or was proposed to merge. Files touched:
          \`\`\`
          $OUT_OF_SCOPE
          \`\`\`
          Worth investigating the prompt/tooling."
