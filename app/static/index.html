<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Habit Tracker Dashboard</title>
<style>
  /* ---------------------------------------------------------------------
   * Design tokens (issue #41, point 1). Every color/spacing/type/radius/
   * shadow value used below comes from one of these custom properties --
   * no one-off hex codes or magic numbers scattered per selector. The
   * dark-mode block further down overrides only the color tokens.
   * ------------------------------------------------------------------- */
  :root {
    color-scheme: light dark;

    --color-bg: #f8fafc;
    --color-surface: #ffffff;
    --color-surface-alt: #f1f5f9;
    --color-border: #e2e8f0;
    --color-text: #0f172a;
    --color-text-muted: #475569;

    --color-primary: #2563eb;
    --color-primary-hover: #1d4ed8;
    --color-primary-contrast: #ffffff;
    --color-focus-ring: #2563eb;

    --color-success-bg: #dcfce7;
    --color-success-text: #15803d;
    --color-success-border: #86efac;

    --color-warning-bg: #fef3c7;
    --color-warning-text: #92400e;
    --color-warning-border: #fcd34d;

    --color-danger-bg: #fee2e2;
    --color-danger-text: #b91c1c;
    --color-danger-border: #fca5a5;

    --space-1: 0.25rem;
    --space-2: 0.5rem;
    --space-3: 0.75rem;
    --space-4: 1rem;
    --space-5: 1.5rem;
    --space-6: 2rem;
    --space-7: 3rem;

    --font-size-sm: 0.85rem;
    --font-size-base: 1rem;
    --font-size-md: 1.05rem;
    --font-size-lg: 1.25rem;

    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --radius-pill: 999px;

    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06), 0 1px 1px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 6px 16px rgba(15, 23, 42, 0.08), 0 2px 4px rgba(15, 23, 42, 0.06);
    --shadow-lg: 0 16px 32px rgba(15, 23, 42, 0.14), 0 4px 8px rgba(15, 23, 42, 0.08);

    --transition-fast: 150ms ease;
    --transition-base: 220ms ease;
  }

  /* Dark palette variant (issue #41, point 7) -- same token names, new values. */
  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #0b0f17;
      --color-surface: #161d29;
      --color-surface-alt: #1e2735;
      --color-border: #2f3a4a;
      --color-text: #f1f5f9;
      --color-text-muted: #94a3b8;

      --color-primary: #60a5fa;
      --color-primary-hover: #7db4fb;
      --color-primary-contrast: #0b111d;
      --color-focus-ring: #7db4fb;

      --color-success-bg: #052e16;
      --color-success-text: #86efac;
      --color-success-border: #166534;

      --color-warning-bg: #451a03;
      --color-warning-text: #fcd34d;
      --color-warning-border: #92400e;

      --color-danger-bg: #450a0a;
      --color-danger-text: #fca5a5;
      --color-danger-border: #b91c1c;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
      --shadow-md: 0 6px 16px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 16px 32px rgba(0, 0, 0, 0.55);
    }
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: var(--color-bg);
    color: var(--color-text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }

  /* Fluid, mobile-first container -- no fixed pixel column (issue #41, point 5). */
  .page {
    width: min(880px, 100%);
    margin-inline: auto;
    padding: clamp(1rem, 4vw, 2.5rem) clamp(1rem, 5vw, 2rem) var(--space-7);
    display: flex;
    flex-direction: column;
    gap: var(--space-6);
  }

  .page-header h1 {
    margin: 0 0 var(--space-1);
    font-size: clamp(1.5rem, 4vw + 0.5rem, 2rem);
  }

  .page-subtitle {
    margin: 0;
    color: var(--color-text-muted);
    font-size: var(--font-size-base);
  }

  h2 {
    font-size: var(--font-size-lg);
    margin: 0 0 var(--space-4);
  }

  .card {
    background: var(--color-surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    padding: var(--space-5);
  }

  .add-habit-form {
    display: grid;
    gap: var(--space-3);
    max-width: 360px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
  }

  .field label {
    font-size: var(--font-size-sm);
    font-weight: 600;
    color: var(--color-text-muted);
  }

  input[type="text"],
  input[type="number"] {
    min-height: 2.5rem;
    padding: 0 var(--space-3);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-surface);
    color: var(--color-text);
    font-size: var(--font-size-base);
  }

  /* Accessible focus rings everywhere, not just default browser outlines
   * (issue #41, point 6). */
  :focus-visible {
    outline: 3px solid var(--color-focus-ring);
    outline-offset: 2px;
  }

  input:focus-visible {
    outline-offset: 1px;
    border-color: var(--color-primary);
  }

  .btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    min-height: 2.75rem;
    padding: 0 var(--space-4);
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    font-size: var(--font-size-base);
    font-weight: 600;
    cursor: pointer;
    width: fit-content;
    transition: background-color var(--transition-fast), border-color var(--transition-fast),
      box-shadow var(--transition-fast), transform var(--transition-fast);
  }

  .btn:disabled {
    cursor: not-allowed;
    opacity: 0.85;
  }

  .btn-primary {
    background: var(--color-primary);
    color: var(--color-primary-contrast);
    box-shadow: var(--shadow-sm);
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--color-primary-hover);
  }

  .btn-secondary {
    background: var(--color-surface);
    color: var(--color-primary);
    border-color: var(--color-primary);
  }

  .btn-secondary:hover:not(:disabled) {
    background: var(--color-surface-alt);
  }

  /* Loading/disabled button states while a fetch is in flight (issue #41,
   * point 3): label hides, a small spinner takes its place, button is
   * inert. */
  .btn.is-loading .btn-label {
    visibility: hidden;
  }

  .btn.is-loading::after {
    content: "";
    position: absolute;
    inset: 0;
    margin: auto;
    width: 1rem;
    height: 1rem;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  .btn-primary.is-loading::after {
    border: 2px solid rgba(255, 255, 255, 0.5);
    border-top-color: var(--color-primary-contrast);
  }

  .btn-secondary.is-loading::after {
    border: 2px solid rgba(37, 99, 235, 0.3);
    border-top-color: var(--color-primary);
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .alert {
    margin: 0;
    border-radius: var(--radius-sm);
    padding: var(--space-2) var(--space-3);
    font-size: var(--font-size-sm);
    font-weight: 600;
  }

  .alert-danger {
    background: var(--color-danger-bg);
    color: var(--color-danger-text);
    border: 1px solid var(--color-danger-border);
  }

  /* Habit cards, not bordered <li> boxes (issue #41, point 2): elevation
   * via shadow, mobile-first responsive grid that naturally stacks to a
   * single column once cards no longer fit two-up. */
  .habit-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
    gap: var(--space-4);
  }

  .habit-item {
    background: var(--color-surface);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    padding: var(--space-4);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-3);
    flex-wrap: wrap;
    transition: box-shadow var(--transition-fast), transform var(--transition-fast);
  }

  .habit-item:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }

  /* Smooth insert transition for a newly-added card (issue #41, point 3). */
  @keyframes card-in {
    from {
      opacity: 0;
      transform: translateY(8px) scale(0.98);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }

  .habit-item--enter {
    animation: card-in var(--transition-base) ease-out;
  }

  @media (prefers-reduced-motion: reduce) {
    .habit-item--enter {
      animation: none;
    }
  }

  .habit-info {
    display: flex;
    flex-direction: column;
    gap: var(--space-1);
    min-width: 0;
  }

  .habit-name-row {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    flex-wrap: wrap;
  }

  .habit-name {
    font-weight: 600;
    font-size: var(--font-size-md);
  }

  .habit-meta {
    font-size: var(--font-size-sm);
    color: var(--color-text-muted);
  }

  /* Category chip: color derived purely from the category string via a
   * hash-to-hue function in the script below (no new data). Lightness gap
   * between background and text is fixed regardless of hue, which keeps
   * contrast well within WCAG AA no matter which category. */
  .category-chip {
    display: inline-flex;
    align-items: center;
    padding: 0.15rem 0.6rem;
    border-radius: var(--radius-pill);
    font-size: var(--font-size-sm);
    font-weight: 600;
    background: hsl(var(--chip-h) 65% 92%);
    color: hsl(var(--chip-h) 45% 28%);
    border: 1px solid hsl(var(--chip-h) 55% 80%);
  }

  @media (prefers-color-scheme: dark) {
    .category-chip {
      background: hsl(var(--chip-h) 35% 20%);
      color: hsl(var(--chip-h) 70% 80%);
      border-color: hsl(var(--chip-h) 40% 32%);
    }
  }

  .habit-actions {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    flex-wrap: wrap;
  }

  /* Status text restyled as inline badges instead of plain colored text
   * (issue #41, point 3). Empty/reset state (no modifier class) stays
   * invisible with no padding so it doesn't reserve a visible pill. */
  .completion-status {
    font-size: var(--font-size-sm);
  }

  .completion-status:is(.success, .already-done, .error) {
    display: inline-flex;
    align-items: center;
    padding: 0.25rem 0.6rem;
    border-radius: var(--radius-pill);
    font-weight: 600;
  }

  .completion-status.success {
    background: var(--color-success-bg);
    color: var(--color-success-text);
    border: 1px solid var(--color-success-border);
  }

  .completion-status.already-done {
    background: var(--color-warning-bg);
    color: var(--color-warning-text);
    border: 1px solid var(--color-warning-border);
  }

  .completion-status.error {
    background: var(--color-danger-bg);
    color: var(--color-danger-text);
    border: 1px solid var(--color-danger-border);
  }

  /* Designed empty state (issue #41, point 4). `.empty-state`'s `display:
   * flex` would otherwise win the cascade over the UA stylesheet's
   * `[hidden] { display: none }`, so it's scoped to `:not([hidden])` --
   * the element must actually disappear while the `hidden` attribute is
   * set, same as the plain `<p hidden>` it replaced. */
  .empty-state:not([hidden]) {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: var(--space-2);
    padding: var(--space-7) var(--space-4);
    border: 1px dashed var(--color-border);
    border-radius: var(--radius-lg);
    background: var(--color-surface-alt);
    color: var(--color-text-muted);
  }

  .empty-state-icon {
    font-size: 2.5rem;
    line-height: 1;
  }

  .empty-state h3 {
    margin: 0;
    color: var(--color-text);
    font-size: var(--font-size-md);
  }

  .empty-state p {
    margin: 0;
    max-width: 32ch;
  }

  .empty-state-cta {
    margin-top: var(--space-2);
    color: var(--color-primary);
    font-weight: 600;
    text-decoration: none;
  }

  .empty-state-cta:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <h1>Habit Tracker Dashboard</h1>
      <p class="page-subtitle">Track your daily habits and mark them done as you go.</p>
    </header>

    <section id="add-habit-section" class="card" aria-labelledby="add-habit-heading">
      <h2 id="add-habit-heading">Add a habit</h2>
      <form id="add-habit-form" class="add-habit-form">
        <div class="field">
          <label for="habit-name-input">Name</label>
          <input id="habit-name-input" name="name" type="text" required maxlength="100" autocomplete="off" />
        </div>
        <div class="field">
          <label for="habit-daily-target-input">Daily target</label>
          <input id="habit-daily-target-input" name="daily_target" type="number" min="1" required />
        </div>
        <div class="field">
          <label for="habit-category-input">Category</label>
          <input id="habit-category-input" name="category" type="text" required maxlength="50" autocomplete="off" />
        </div>
        <button id="add-habit-submit" class="btn btn-primary" type="submit">
          <span class="btn-label">Add habit</span>
        </button>
        <p id="add-habit-error" class="alert alert-danger" role="alert" hidden></p>
      </form>
    </section>

    <section id="habits-section" aria-labelledby="habits-heading">
      <h2 id="habits-heading">Habits</h2>
      <div id="habit-list-empty" class="empty-state" hidden>
        <span class="empty-state-icon" aria-hidden="true">🌱</span>
        <h3>No habits yet</h3>
        <p>Add your first habit above to start tracking your daily progress.</p>
        <a class="empty-state-cta" href="#habit-name-input">Add a habit &rarr;</a>
      </div>
      <ul id="habit-list" class="habit-list"></ul>
    </section>
  </div>

  <script>
    const habitList = document.getElementById("habit-list");
    const habitListEmpty = document.getElementById("habit-list-empty");
    const addHabitForm = document.getElementById("add-habit-form");
    const addHabitError = document.getElementById("add-habit-error");
    const addHabitSubmit = document.getElementById("add-habit-submit");
    const emptyStateCta = document.querySelector(".empty-state-cta");

    function updateEmptyState() {
      habitListEmpty.hidden = habitList.children.length > 0;
    }

    // Small hash-to-hue function (issue #41, point 2): derives a stable
    // color per category string, no new backend data. Same category
    // always maps to the same hue within a page load (and across loads,
    // since the hash is deterministic).
    function hashHue(value) {
      let hash = 0;
      for (let i = 0; i < value.length; i++) {
        hash = value.charCodeAt(i) + ((hash << 5) - hash);
        hash |= 0;
      }
      return Math.abs(hash) % 360;
    }

    function setButtonLoading(button, isLoading) {
      button.disabled = isLoading;
      button.classList.toggle("is-loading", isLoading);
      button.setAttribute("aria-busy", String(isLoading));
    }

    function habitItemMarkup(habit) {
      const li = document.createElement("li");
      li.className = "habit-item";
      li.dataset.habitId = String(habit.id);
      const hue = hashHue(habit.category.trim().toLowerCase());
      li.innerHTML = `
        <div class="habit-info">
          <div class="habit-name-row">
            <span class="habit-name">${escapeHtml(habit.name)}</span>
            <span class="category-chip" style="--chip-h:${hue}">${escapeHtml(habit.category)}</span>
          </div>
          <span class="habit-meta">Target: ${habit.daily_target}/day</span>
        </div>
        <div class="habit-actions">
          <button class="mark-done-btn btn btn-secondary" type="button" data-habit-id="${habit.id}">
            <span class="btn-label">Mark done today</span>
          </button>
          <span class="completion-status" data-habit-id="${habit.id}" aria-live="polite"></span>
        </div>
      `;
      return li;
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value;
      return div.innerHTML;
    }

    function renderHabit(habit, { animate = false } = {}) {
      const li = habitItemMarkup(habit);
      if (animate) {
        li.classList.add("habit-item--enter");
        li.addEventListener("animationend", () => li.classList.remove("habit-item--enter"), {
          once: true,
        });
      }
      habitList.appendChild(li);
      updateEmptyState();
    }

    async function loadHabits() {
      const response = await fetch("/habits");
      if (!response.ok) {
        return;
      }
      const habits = await response.json();
      habitList.innerHTML = "";
      habits.forEach((habit) => renderHabit(habit));
      updateEmptyState();
    }

    async function handleAddHabit(event) {
      event.preventDefault();
      addHabitError.hidden = true;
      addHabitError.textContent = "";

      const formData = new FormData(addHabitForm);
      const payload = {
        name: formData.get("name"),
        daily_target: Number(formData.get("daily_target")),
        category: formData.get("category"),
      };

      setButtonLoading(addHabitSubmit, true);
      try {
        const response = await fetch("/habits", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        if (!response.ok) {
          const body = await response.json().catch(() => ({}));
          addHabitError.textContent = summarizeError(body) || `Could not add habit (${response.status}).`;
          addHabitError.hidden = false;
          return;
        }

        const habit = await response.json();
        renderHabit(habit, { animate: true });
        addHabitForm.reset();
      } finally {
        setButtonLoading(addHabitSubmit, false);
      }
    }

    function summarizeError(body) {
      if (!body || !body.detail) {
        return null;
      }
      if (Array.isArray(body.detail)) {
        return body.detail.map((err) => `${err.loc?.at(-1) ?? "field"}: ${err.msg}`).join("; ");
      }
      return String(body.detail);
    }

    async function handleMarkDone(event) {
      const button = event.target.closest(".mark-done-btn");
      if (!button) {
        return;
      }
      const habitId = button.dataset.habitId;
      const status = habitList.querySelector(`.completion-status[data-habit-id="${habitId}"]`);
      status.className = "completion-status";
      status.textContent = "";

      setButtonLoading(button, true);
      try {
        const response = await fetch(`/habits/${habitId}/completions`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({}),
        });

        if (response.status === 201) {
          status.textContent = "Done today ✓";
          status.classList.add("success");
        } else if (response.status === 409) {
          status.textContent = "Already done today";
          status.classList.add("already-done");
        } else {
          const body = await response.json().catch(() => ({}));
          status.textContent = summarizeError(body) || `Could not mark done (${response.status}).`;
          status.classList.add("error");
        }
      } finally {
        setButtonLoading(button, false);
      }
    }

    addHabitForm.addEventListener("submit", handleAddHabit);
    habitList.addEventListener("click", handleMarkDone);
    emptyStateCta?.addEventListener("click", (event) => {
      event.preventDefault();
      document.getElementById("habit-name-input").focus();
    });

    loadHabits();
  </script>
</body>
</html>
