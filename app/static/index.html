<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Habit Tracker Dashboard</title>
<style>
  :root {
    color-scheme: light;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body {
    max-width: 640px;
    margin: 2rem auto;
    padding: 0 1rem;
    color: #1a1a1a;
  }
  h1 {
    font-size: 1.5rem;
  }
  h2 {
    font-size: 1.1rem;
    margin-top: 2rem;
  }
  form {
    display: grid;
    gap: 0.5rem;
    max-width: 320px;
  }
  label {
    display: flex;
    flex-direction: column;
    font-size: 0.85rem;
    gap: 0.2rem;
  }
  input {
    padding: 0.4rem;
    font-size: 1rem;
  }
  button {
    padding: 0.5rem 0.75rem;
    cursor: pointer;
  }
  #add-habit-form button {
    width: fit-content;
  }
  #add-habit-error {
    color: #b00020;
  }
  ul#habit-list {
    list-style: none;
    padding: 0;
    display: grid;
    gap: 0.6rem;
  }
  li.habit-item {
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 0.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  .habit-item .habit-info {
    display: flex;
    flex-direction: column;
  }
  .habit-item .habit-name {
    font-weight: 600;
  }
  .habit-item .habit-meta {
    font-size: 0.85rem;
    color: #555;
  }
  .habit-actions {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .completion-status {
    font-size: 0.85rem;
  }
  .completion-status.success {
    color: #1a7f37;
  }
  .completion-status.already-done {
    color: #9a6700;
  }
  .completion-status.error {
    color: #b00020;
  }
</style>
</head>
<body>
  <h1>Habit Tracker Dashboard</h1>

  <section id="add-habit-section">
    <h2>Add a habit</h2>
    <form id="add-habit-form">
      <label for="habit-name-input">
        Name
        <input id="habit-name-input" name="name" type="text" required maxlength="100" />
      </label>
      <label for="habit-daily-target-input">
        Daily target
        <input id="habit-daily-target-input" name="daily_target" type="number" min="1" required />
      </label>
      <label for="habit-category-input">
        Category
        <input id="habit-category-input" name="category" type="text" required maxlength="50" />
      </label>
      <button id="add-habit-submit" type="submit">Add habit</button>
      <p id="add-habit-error" role="alert" hidden></p>
    </form>
  </section>

  <section id="habits-section">
    <h2>Habits</h2>
    <p id="habit-list-empty" hidden>No habits yet — add one above.</p>
    <ul id="habit-list"></ul>
  </section>

  <script>
    const habitList = document.getElementById("habit-list");
    const habitListEmpty = document.getElementById("habit-list-empty");
    const addHabitForm = document.getElementById("add-habit-form");
    const addHabitError = document.getElementById("add-habit-error");

    function updateEmptyState() {
      habitListEmpty.hidden = habitList.children.length > 0;
    }

    function habitItemMarkup(habit) {
      const li = document.createElement("li");
      li.className = "habit-item";
      li.dataset.habitId = String(habit.id);
      li.innerHTML = `
        <div class="habit-info">
          <span class="habit-name">${escapeHtml(habit.name)}</span>
          <span class="habit-meta">${escapeHtml(habit.category)} · target ${habit.daily_target}/day</span>
        </div>
        <div class="habit-actions">
          <button class="mark-done-btn" type="button" data-habit-id="${habit.id}">Mark done today</button>
          <span class="completion-status" data-habit-id="${habit.id}" aria-live="polite"></span>
        </div>
      `;
      return li;
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value;
      return div.innerHTML;
    }

    function renderHabit(habit) {
      habitList.appendChild(habitItemMarkup(habit));
      updateEmptyState();
    }

    async function loadHabits() {
      const response = await fetch("/habits");
      if (!response.ok) {
        return;
      }
      const habits = await response.json();
      habitList.innerHTML = "";
      habits.forEach(renderHabit);
      updateEmptyState();
    }

    async function handleAddHabit(event) {
      event.preventDefault();
      addHabitError.hidden = true;
      addHabitError.textContent = "";

      const formData = new FormData(addHabitForm);
      const payload = {
        name: formData.get("name"),
        daily_target: Number(formData.get("daily_target")),
        category: formData.get("category"),
      };

      const response = await fetch("/habits", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        addHabitError.textContent = summarizeError(body) || `Could not add habit (${response.status}).`;
        addHabitError.hidden = false;
        return;
      }

      const habit = await response.json();
      renderHabit(habit);
      addHabitForm.reset();
    }

    function summarizeError(body) {
      if (!body || !body.detail) {
        return null;
      }
      if (Array.isArray(body.detail)) {
        return body.detail.map((err) => `${err.loc?.at(-1) ?? "field"}: ${err.msg}`).join("; ");
      }
      return String(body.detail);
    }

    async function handleMarkDone(event) {
      const button = event.target.closest(".mark-done-btn");
      if (!button) {
        return;
      }
      const habitId = button.dataset.habitId;
      const status = habitList.querySelector(`.completion-status[data-habit-id="${habitId}"]`);
      status.className = "completion-status";
      status.textContent = "";

      const response = await fetch(`/habits/${habitId}/completions`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({}),
      });

      if (response.status === 201) {
        status.textContent = "Done today ✓";
        status.classList.add("success");
      } else if (response.status === 409) {
        status.textContent = "Already done today";
        status.classList.add("already-done");
      } else {
        const body = await response.json().catch(() => ({}));
        status.textContent = summarizeError(body) || `Could not mark done (${response.status}).`;
        status.classList.add("error");
      }
    }

    addHabitForm.addEventListener("submit", handleAddHabit);
    habitList.addEventListener("click", handleMarkDone);

    loadHabits();
  </script>
</body>
</html>
